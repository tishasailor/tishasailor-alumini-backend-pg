<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Employee CRUD</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 1000px;
            margin: auto;
            border-radius: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #addBtn {
            background-color: green;
            color: white;
        }

        #updateBtn {
            background-color: orange;
            color: white;
            display: none;
        }

        #showBtn {
            background-color: blue;
            color: white;
        }

        #clearBtn {
            background-color: gray;
            color: white;
        }

        .employee {
            background: #f9f9f9;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .employee-photo {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
            display: block;
            margin-bottom: 15px;
        }

        .update-button {
            background-color: orange;
            color: white;
        }

        .delete-button {
            background-color: red;
            color: white;
        }

        #message {
            margin-top: 15px;
            padding: 10px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>Employee Registration</h1>


    <form id="employeeForm">


        <!-- Employee Name -->

        <div class="form-group">

            <label>Employee Name</label>

            <input
                type="text"
                id="employeeName"
                required
            >

        </div>


        <!-- Employee ID -->

        <div class="form-group">

            <label>Employee ID</label>

            <input
                type="text"
                id="employeeId"
                placeholder="Example: EMP002"
                required
            >

        </div>


        <!-- Email -->

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="email"
                required
            >

        </div>


        <!-- Mobile -->

        <div class="form-group">

            <label>Mobile Number</label>

            <input
                type="text"
                id="mobile"
                maxlength="10"
                required
            >

        </div>


        <!-- Password -->

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                required
            >

        </div>


        <!-- Confirm Password -->

        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                required
            >

        </div>


        <!-- Gender -->

        <div class="form-group">

            <label>Gender</label>

            <select id="gender" required>

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- Date of Birth -->

        <div class="form-group">

            <label>Date of Birth</label>

            <input
                type="date"
                id="dateOfBirth"
                required
            >

        </div>


        <!-- Department -->

        <div class="form-group">

            <label>Department</label>

            <select id="department" required>

                <option value="">
                    Select Department
                </option>

                <option value="IT">
                    IT
                </option>

                <option value="HR">
                    HR
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="Marketing">
                    Marketing
                </option>

            </select>

        </div>


        <!-- Designation -->

        <div class="form-group">

            <label>Designation</label>

            <input
                type="text"
                id="designation"
                required
            >

        </div>


        <!-- Date of Joining -->

        <div class="form-group">

            <label>Date of Joining</label>

            <input
                type="date"
                id="dateOfJoining"
                required
            >

        </div>


        <!-- Employment Type -->

        <div class="form-group">

            <label>Employment Type</label>

            <select id="employmentType" required>

                <option value="">
                    Select Employment Type
                </option>

                <option value="Full-Time">
                    Full-Time
                </option>

                <option value="Part-Time">
                    Part-Time
                </option>

                <option value="Contract">
                    Contract
                </option>

                <option value="Intern">
                    Intern
                </option>

            </select>

        </div>


        <!-- Profile Photo -->

        <div class="form-group">

            <label>Profile Photo</label>

            <input
                type="file"
                id="profilePhoto"
                accept="image/*"
            >

        </div>


        <!-- Buttons -->

        <button
            type="submit"
            id="addBtn"
        >
            Add Employee
        </button>


        <button
            type="button"
            id="updateBtn"
        >
            Update Employee
        </button>


        <button
            type="button"
            id="showBtn"
        >
            Show All Data
        </button>


        <button
            type="button"
            id="clearBtn"
        >
            Clear
        </button>


    </form>


    <div id="message"></div>


    <h2>Employee Data</h2>


    <div id="output"></div>


</div>


<script src="script.js"></script>


</body>

</html>
